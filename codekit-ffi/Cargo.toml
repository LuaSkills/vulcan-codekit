[package]
name = "vulcan-codekit-ffi"
version = "0.2.2"
edition = "2021"
license = "MIT"
publish = false

[lib]
name = "vulcan_codekit_ffi"
crate-type = ["cdylib", "rlib"]

[dependencies]
ast-grep-config = "0.42.1"
ast-grep-core = { version = "0.42.1", features = ["tree-sitter"] }
ast-grep-language = "0.42.1"
ignore = "=0.4.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokei = { version = "=15.0.0", default-features = false }

[dev-dependencies]
tempfile = "3"
