name: vulcan-codekit
version: 0.2.10
debug: false
registration:
  mode: explicit
  default_locale: en-US
  locales:
    en-US:
      title: "Vulcan CodeKit"
      description: "Map repositories, inspect code structure, and replace complete function or method bodies."
    zh-CN:
      title: "Vulcan CodeKit"
      description: "查看仓库结构、定位代码归属并替换完整函数或方法。"
    zh-TW:
      title: "Vulcan CodeKit"
      description: "查看儲存庫結構、定位程式碼歸屬並替換完整函式或方法。"
  prompt_skills:
    - name: codekit-workflow
      file: skills/codekit-workflow/SKILL.md
      locales:
        en-US:
          title: "Code navigation workflow"
          description: "Use this guide for repository maps, owner-aware search, exact source extraction, or whole-function edits."
        zh-CN:
          title: "代码导航指南"
          description: "按仓库概览、归属定位、源码读取和整函数修改选择工具。"
        zh-TW:
          title: "程式碼導覽指南"
          description: "依儲存庫概覽、歸屬定位、原始碼讀取及整函式修改選擇工具。"
entries:
  - name: repo-map
    description: "[REPOSITORY FIRST MAP] Use this as the first step in an unfamiliar repository. Returns a directory-only tree, complete file census, Tokei all-language statistics, and explicit folding diagnostics without exposing a file tree."
    lua_entry: runtime/codekit-repo-map.lua
    lua_module: codekit_repo_map
    parameters:
      - name: PWD
        type: string
        description: "Optional host-managed absolute project or workspace root. VulcanCode hides and injects this parameter when a current project is available. Relative dir values are resolved from this root; without a usable PWD, dir must be absolute."
        required: false
      - name: dir
        type: string
        description: "Required. Exactly one existing repository or directory to scan recursively; files and multi-path input are rejected. May be relative when PWD is available, otherwise must be absolute."
        required: true
      - name: max_depth
        type: integer
        description: "Optional model-visible directory depth from 1 to 8 (default: 3). The complete repository is still scanned and aggregated before deeper directory records are folded."
        required: false
      - name: noignore
        type: boolean
        description: "Optional. Disable ordinary .gitignore, .ignore, and .tokeignore rules only when true. CodeKit hard exclusions such as .git, target, node_modules, and dist remain active."
        required: false
  - name: ast-detail
    description: "[FILE AST DETAIL] Inspect one or more exact source files and return plain Markdown AST details. Use this only after you already know the exact files, typically from vulcan_codekit_ast_tree or vulcan_codekit_rg."
    lua_entry: runtime/codekit-ast-detail.lua
    lua_module: codekit_ast_detail
    parameters:
      - name: PWD
        type: string
        description: "Optional host-managed absolute project or workspace root. VulcanCode hides and injects this parameter when a current project is available. Relative path values in paths are resolved from this root; without a usable PWD, every path must be absolute."
        required: false
      - name: paths
        type: string
        description: "One or more explicit source-file paths separated by newlines (\\n). Paths may be relative when PWD is available, otherwise every path must be absolute. This tool does not accept directories or mixed path sets, and it supports at most 20 files per request."
        required: true
      - name: comment
        type: boolean
        description: "Include condensed comment summaries for functions in the structural output (default: false). Separator-style comment banners and metadata-only lines such as params/returns are filtered out, and each summary is compressed to a short single-line note."
        required: false
  - name: rg
    description: "[TEXT-TO-STRUCTURE BRIDGE] Search a directory with ripgrep and return all matching lines in the selected scope as plain Markdown. Include indexed AST owner context where available; preserve matches outside indexed ranges as file-level unowned matches, even when a file has no indexed symbols. Oversized lines use match-centered excerpts with byte ranges and explicit truncation reasons; no occurrences are dropped."
    lua_entry: runtime/codekit-rg.lua
    lua_module: codekit_rg
    parameters:
      - name: PWD
        type: string
        description: "Optional host-managed absolute project or workspace root. VulcanCode hides and injects this parameter when a current project is available. Relative dir values are resolved from this root; without a usable PWD, dir must be absolute."
        required: false
      - name: dir
        type: string
        description: "Required. Target directory to search recursively; must point to an existing directory. May be relative when PWD is available, otherwise must be absolute."
        required: true
      - name: extensions
        type: string
        description: "Optional file-extension filter, comma-separated (for example lua,rs,ts). Common language names such as rust or typescript are normalized to their extensions. When omitted, the default source-code set is used: bash, sh, zsh, c, h, cpp, cxx, cc, c++, hpp, hh, hxx, cu, ino, cs, ex, exs, go, hs, java, js, jsx, mjs, cjs, kt, kts, ktm, lua, nix, php, phtml, py, pyi, py3, bzl, rb, rbw, gemspec, rs, scala, sc, sbt, sol, swift, ts, mts, cts, tsx. The default excludes css, html, json, yaml/yml, hcl/tf/tfvars, and md."
        required: false
      - name: noignore
        type: boolean
        description: "Disable ignore rules only when set to true. Leave it unset for the normal ignored-by-default search behavior."
        required: false
      - name: rg_pattern
        type: string
        description: "Ripgrep regex used for the first-pass text search. By default this uses ripgrep's Rust regex engine, so PCRE2-only features such as look-around and backreferences are rejected unless regex_engine is set to pcre2."
        required: true
      - name: regex_engine
        type: string
        description: "Regex engine for rg_pattern. Allowed values: rust or pcre2. Defaults to rust for predictable performance; pcre2 adds ripgrep --pcre2 for look-around/backreference patterns."
        required: false
  - name: markdown-menu
    description: "[MARKDOWN MENU] Triage Markdown files by headings only. Use this to locate the right docs file or section before reading body text elsewhere."
    lua_entry: runtime/codekit-markdown-menu.lua
    lua_module: codekit_markdown_menu
    parameters:
      - name: PWD
        type: string
        description: "Optional host-managed absolute project or workspace root. VulcanCode hides and injects this parameter when a current project is available. Relative path values, including the default '.', are resolved from this root; without a usable PWD, every path must be absolute."
        required: false
      - name: path
        type: string
        description: "Target path. Supports a single file/directory, or multiple paths separated by newlines (\\n). Paths may be relative when PWD is available, otherwise every path must be absolute. Directory and file paths may be mixed in one request and duplicate Markdown files are automatically removed."
        required: false
      - name: recursive
        type: boolean
        description: "Whether to recurse into subdirectories when a directory is encountered (default: false). Keep this false for top-level doc triage and enable it only when you need nested Markdown files."
        required: false
      - name: noignore
        type: boolean
        description: "Disable ignore rules only when set to true. Leave it unset for the normal ignored-by-default documentation scan behavior."
        required: false
  - name: node-source
    description: "[NODE SOURCE] Extract the full current source of one or more function/method nodes selected by structural_path. This is typically the read step before vulcan_codekit_patch so the caller can inspect the exact node source and prepare a whole-node replacement. Runtime hashes and overflow metadata are not included in normal success text. Only function/method nodes are supported today."
    lua_entry: runtime/codekit-node-source.lua
    lua_module: codekit_node_source
    input_schema_file: schemas/node-source.input.schema.json
  - name: ast-tree
    description: "[DIRECTORY AST TREE] Pick candidate source files from exactly one directory before deep inspection. Returns a compact recursive Markdown tree grouped by subdirectory."
    lua_entry: runtime/codekit-ast-tree.lua
    lua_module: codekit_ast_tree
    parameters:
      - name: PWD
        type: string
        description: "Optional host-managed absolute project or workspace root. VulcanCode hides and injects this parameter when a current project is available. Relative dir values are resolved from this root; without a usable PWD, dir must be absolute."
        required: false
      - name: dir
        type: string
        description: "Exactly one existing directory path to scan recursively. May be relative when PWD is available, otherwise must be absolute. Files, newline-separated path lists, and multiple directories are rejected."
        required: true
      - name: extensions
        type: string
        description: "Optional file-extension filter, comma-separated (for example rs,ts,tsx). Common language names such as rust or typescript are normalized to their extensions. When omitted, the default source-code set is used: bash, sh, zsh, c, h, cpp, cxx, cc, c++, hpp, hh, hxx, cu, ino, cs, ex, exs, go, hs, java, js, jsx, mjs, cjs, kt, kts, ktm, lua, nix, php, phtml, py, pyi, py3, bzl, rb, rbw, gemspec, rs, scala, sc, sbt, sol, swift, ts, mts, cts, tsx. The default excludes css, html, json, yaml/yml, hcl/tf/tfvars, and md."
        required: false
      - name: noignore
        type: boolean
        description: "Disable ignore rules only when set to true. Leave it unset for the normal ignored-by-default tree scan behavior."
        required: false
  - name: patch
    description: "[WHOLE FUNCTION PATCH] Replace one or more whole function/method nodes by structural_path and return the actual post-write target source with local context. This is a function/procedure-level whole-node replacement workflow, typically used after vulcan_codekit_node_source has returned the current node source. The replacement must be the complete function/method source, not a fragment. Non-function symbols such as enum, enum variant/member, struct field, type alias, and statement-level nodes are not supported."
    lua_entry: runtime/codekit-patch.lua
    lua_module: codekit_patch
    input_schema_file: schemas/patch.input.schema.json
