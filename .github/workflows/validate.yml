name: Validate Vulcan CodeKit LuaSkill

on:
  pull_request:
  workflow_dispatch:

jobs:
  windows-unload:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build Windows DLL with bounded compilation
        run: cargo build --manifest-path codekit-ffi/Cargo.toml --release --locked -j 4
      - name: Verify workers stop before DLL unload and reload
        run: python ./scripts/check_ffi_unload.py --library-path codekit-ffi/target/release/vulcan_codekit_ffi.dll

  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked --version 0.20.2

      - name: Install validation dependencies
        run: python -m pip install --upgrade pip pyyaml

      - name: Validate strict skill layout
        run: python ./scripts/validate_skill.py

      - name: Install Lua for runtime regression checks
        run: sudo apt-get install -y lua5.4

      - name: Verify RG matches inside and outside indexed AST ranges
        run: lua5.4 ./scripts/verify_rg_matches.lua

      - name: Package LuaSkill release path smoke
        run: python ./scripts/package_skill.py --out-dir dist-skill-smoke

      - name: Check LuaSkill archive root
        shell: python
        run: |
          from pathlib import Path
          from zipfile import ZipFile

          package_path = next(Path("dist-skill-smoke").glob("vulcan-codekit-v*-skill.zip"))
          with ZipFile(package_path) as archive:
              names = archive.namelist()

          if not any(name.startswith("vulcan-codekit/") for name in names):
              raise SystemExit("LuaSkill package must contain a vulcan-codekit/ root directory")
          if any(name.startswith("luaskills-vulcan-codekit/") for name in names):
              raise SystemExit("LuaSkill package must not contain a luaskills-vulcan-codekit/ root directory")
          if not any(name.startswith("vulcan-codekit/schemas/") for name in names):
              raise SystemExit("LuaSkill package must contain the schemas/ directory contents")
          if "vulcan-codekit/runtime/codekit-path.lua" not in names:
              raise SystemExit("LuaSkill package must contain the shared host-managed PWD path module")

      - name: Check unified CodeKit FFI dependency licenses
        run: cargo deny --config deny.toml --exclude-dev check licenses
        working-directory: codekit-ffi

      - name: Check generated dependency license report
        run: python ./scripts/generate_cargo_deny_notices.py --check

      - name: Test unified CodeKit FFI crate
        run: |
          cargo fmt --manifest-path codekit-ffi/Cargo.toml --check
          cargo clippy --manifest-path codekit-ffi/Cargo.toml --all-targets --locked -- -D warnings
          cargo test --manifest-path codekit-ffi/Cargo.toml --locked

      - name: Build unified CodeKit FFI release path smoke
        run: cargo build --manifest-path codekit-ffi/Cargo.toml --release --locked --target x86_64-unknown-linux-gnu --target-dir target

      - name: Execute unified CodeKit FFI public ABI smoke
        run: python ./scripts/smoke_ffi.py --library-path target/x86_64-unknown-linux-gnu/release/libvulcan_codekit_ffi.so --repo-root .

      - name: Package unified CodeKit FFI release path smoke
        run: python ./scripts/package_ffi.py --platform linux-x64 --library-path target/x86_64-unknown-linux-gnu/release/libvulcan_codekit_ffi.so --out-dir dist-ffi-smoke

      - name: Check unified CodeKit FFI archive contract
        shell: python
        run: |
          import hashlib
          from pathlib import Path
          from zipfile import ZipFile

          # Resolve the exact smoke archive and checksum produced by the release packager.
          # 解析发布打包器生成的精确 smoke 归档与校验文件。
          package_path = Path("dist-ffi-smoke/codekit-ffi-linux-x64.zip")
          checksum_path = Path("dist-ffi-smoke/codekit-ffi-linux-x64.sha256.txt")
          # Read archive members before validating the complete compliance payload.
          # 在校验完整合规载荷前读取归档成员。
          with ZipFile(package_path) as archive:
              names = set(archive.namelist())

          # Define the exact required archive paths for the Linux smoke platform.
          # 定义 Linux smoke 平台要求的精确归档路径。
          required_names = {
              "libvulcan_codekit_ffi.so",
              "licenses/LICENSE",
              "licenses/THIRD_PARTY_NOTICES.md",
              "licenses/THIRD_PARTY_LICENSES.md",
          }
          if names != required_names:
              raise SystemExit(f"unexpected CodeKit FFI archive members: {sorted(names)}")

          # Compare the emitted checksum with the actual archive digest.
          # 将输出的校验值与归档实际摘要进行比较。
          expected_digest = checksum_path.read_text(encoding="utf-8").split()[0]
          actual_digest = hashlib.sha256(package_path.read_bytes()).hexdigest()
          if actual_digest != expected_digest:
              raise SystemExit("CodeKit FFI checksum does not match the packaged archive")
