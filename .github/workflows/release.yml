name: Release Vulcan CodeKit LuaSkill

# This workflow can be triggered manually so skill and FFI assets can be rebuilt independently.
# 该工作流支持手动触发，便于独立重建技能包与 FFI 产物。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Optional release tag override. Leave empty to use skill.yaml version."
        required: false
      build_luaskill:
        description: "Build LuaSkill package"
        required: true
        default: "on"
        type: choice
        options: ["on", "off"]
      luaskill_runner:
        description: "LuaSkill package runner (off to disable)"
        required: true
        default: "ubuntu-latest"
        type: choice
        options: ["off", "ubuntu-latest", "9950x", "proart"]
      linux_x64_runner:
        description: "Linux x64 FFI runner (off to disable)"
        required: true
        default: "ubuntu-latest"
        type: choice
        options: ["off", "ubuntu-latest", "ubuntu-24.04", "9950x", "proart"]
      linux_arm64_runner:
        description: "Linux ARM64 FFI runner (off to disable)"
        required: true
        default: "ubuntu-24.04-arm"
        type: choice
        options: ["off", "ubuntu-24.04-arm", "ubuntu-22.04-arm", "9950x", "proart"]
      macos_arm64_runner:
        description: "macOS ARM64 FFI runner (off to disable)"
        required: true
        default: "macos-15"
        type: choice
        options: ["off", "macos-15", "macos-26", "9950x", "proart"]
      macos_x64_runner:
        description: "macOS x64 FFI runner (off to disable)"
        required: true
        default: "macos-15-intel"
        type: choice
        options: ["off", "macos-15-intel", "macos-26-intel", "9950x", "proart"]
      windows_x64_runner:
        description: "Windows x64 FFI runner (off to disable)"
        required: true
        default: "windows-latest"
        type: choice
        options: ["off", "windows-latest", "9950x-win", "proart-win"]

permissions:
  contents: write

concurrency:
  group: codekit-release-${{ github.workflow }}-${{ github.event.inputs.version || github.ref_name }}
  # Never cancel an in-flight immutable-tag build, because cancellation can leave release assets incomplete.
  # 绝不取消正在执行的不可变标签构建，避免发布资产处于不完整状态。
  cancel-in-progress: false

jobs:
  prepare-release:
    name: Prepare Release Plan
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.prepare.outputs.version }}
      luaskill_runner: ${{ steps.prepare.outputs.luaskill_runner }}
      build_luaskill: ${{ steps.prepare.outputs.build_luaskill }}
      ffi_matrix: ${{ steps.prepare.outputs.ffi_matrix }}
      has_ffi_targets: ${{ steps.prepare.outputs.has_ffi_targets }}
      has_work: ${{ steps.prepare.outputs.has_work }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build release plan from inputs
        id: prepare
        shell: pwsh
        env:
          INPUT_VERSION: ${{ github.event.inputs.version || '' }}
          INPUT_REF_NAME: ${{ github.ref_name }}
          INPUT_REF_TYPE: ${{ github.ref_type }}
          INPUT_BUILD_LUASKILL: ${{ github.event.inputs.build_luaskill || 'on' }}
          INPUT_LUASKILL_RUNNER: ${{ github.event.inputs.luaskill_runner || 'ubuntu-latest' }}
          INPUT_LINUX_X64_RUNNER: ${{ github.event.inputs.linux_x64_runner || 'ubuntu-latest' }}
          INPUT_LINUX_ARM64_RUNNER: ${{ github.event.inputs.linux_arm64_runner || 'ubuntu-24.04-arm' }}
          INPUT_MACOS_ARM64_RUNNER: ${{ github.event.inputs.macos_arm64_runner || 'macos-15' }}
          INPUT_MACOS_X64_RUNNER: ${{ github.event.inputs.macos_x64_runner || 'macos-15-intel' }}
          INPUT_WINDOWS_X64_RUNNER: ${{ github.event.inputs.windows_x64_runner || 'windows-latest' }}
        run: |
          # Normalize-Runner keeps tag-push defaults and manual input values on the same path.
          # Normalize-Runner 将 tag push 默认值与手动输入值收敛到同一处理路径。
          function Normalize-Runner {
            param(
              [string]$Runner,
              [string]$Default
            )

            if ([string]::IsNullOrWhiteSpace($Runner)) {
              return $Default
            }

            return $Runner.Trim()
          }

          # Read-SkillVersion reads the release version from skill.yaml so the workflow has no hard-coded skill version.
          # Read-SkillVersion 从 skill.yaml 读取发布版本，避免 workflow 硬编码技能版本。
          function Read-SkillVersion {
            param(
              [string]$Path
            )

            $text = [System.IO.File]::ReadAllText($Path)
            $match = [regex]::Match($text, '(?m)^version:\s*([^\s#]+)')
            if (-not $match.Success) {
              throw "skill.yaml must declare one top-level version field"
            }

            return $match.Groups[1].Value.Trim().Trim([char]0x22, [char]0x27)
          }

          # Read-CargoPackageVersion reads the first package version from the unified FFI manifest.
          # Read-CargoPackageVersion 从统一 FFI 清单读取第一个 package 版本。
          function Read-CargoPackageVersion {
            param(
              [string]$Path
            )

            $text = [System.IO.File]::ReadAllText($Path)
            $match = [regex]::Match($text, '(?m)^\s*version\s*=\s*([^\s#]+)')
            if (-not $match.Success) {
              throw "$Path must declare one package version field"
            }

            return $match.Groups[1].Value.Trim().Trim([char]0x22, [char]0x27)
          }

          # Read-CodeKitFfiDependencyVersion reads the exact codekit-ffi version from dependencies.yaml.
          # Read-CodeKitFfiDependencyVersion 从 dependencies.yaml 读取精确的 codekit-ffi 版本。
          function Read-CodeKitFfiDependencyVersion {
            param(
              [string]$Path
            )

            $lines = Get-Content -Path $Path
            $insideCodeKitFfi = $false
            foreach ($line in $lines) {
              if ($line -match '^\s*-\s+name:\s*codekit-ffi\s*$') {
                $insideCodeKitFfi = $true
                continue
              }
              $versionMatch = [regex]::Match($line, '^\s+version:\s*([^\s#]+)')
              if ($insideCodeKitFfi -and $versionMatch.Success) {
                return $versionMatch.Groups[1].Value.Trim().Trim([char]0x22, [char]0x27)
              }
              if ($insideCodeKitFfi -and $line -match '^\s*-\s+name:') {
                break
              }
            }

            throw "dependencies.yaml must declare one codekit-ffi version"
          }

          # Add-FfiTarget appends one enabled platform entry and keeps disabled platforms out of the matrix.
          # Add-FfiTarget 只追加已启用的平台条目，避免关闭的平台进入矩阵。
          function Add-FfiTarget {
            param(
              [System.Collections.Generic.List[object]]$Targets,
              [string]$Platform,
              [string]$Runner,
              [string]$RustTarget,
              [string]$LibraryPath
            )

            if ([string]::IsNullOrWhiteSpace($Runner) -or $Runner -eq "off") {
              return
            }

            $Targets.Add([ordered]@{
              platform = $Platform
              runner = $Runner
              rust_target = $RustTarget
              library_path = $LibraryPath
            })
          }

          # Resolve the requested immutable tag before reading any release manifest content.
          # 在读取任何发布清单内容前解析请求的不可变标签。
          $versionInput = Normalize-Runner -Runner $env:INPUT_VERSION -Default ""
          if (-not [string]::IsNullOrWhiteSpace($versionInput)) {
            $version = $versionInput
          } elseif ($env:INPUT_REF_TYPE -eq "tag" -and -not [string]::IsNullOrWhiteSpace($env:INPUT_REF_NAME)) {
            $version = $env:INPUT_REF_NAME.Trim()
          } else {
            $dispatchSkillVersion = Read-SkillVersion -Path "skill.yaml"
            $version = "v$dispatchSkillVersion"
          }

          if (-not $version.StartsWith("v")) {
            $version = "v$version"
          }

          # Resolve only an existing reviewed tag so manual rebuilds cannot publish an untagged branch snapshot.
          # 仅解析已存在且经过审核的标签，避免手动重建发布未打标的分支快照。
          git rev-parse --quiet --verify "refs/tags/$version^{commit}" | Out-Null
          if ($LASTEXITCODE -ne 0) {
            throw "release tag $version does not exist in the checked-out repository"
          }
          # Switch the preparation workspace to the exact tag before deriving versions or build metadata.
          # 在派生版本或构建元数据前，将准备工作区切换到精确标签。
          git checkout --detach "refs/tags/$version"
          if ($LASTEXITCODE -ne 0) {
            throw "failed to check out release tag $version"
          }

          # Validate every release version from the exact tagged source, including manual rebuilds.
          # 从精确标签源码校验每个发布版本，同时覆盖手动重建场景。
          $skillVersion = Read-SkillVersion -Path "skill.yaml"
          $ffiVersion = Read-CargoPackageVersion -Path "codekit-ffi/Cargo.toml"
          $dependencyVersion = Read-CodeKitFfiDependencyVersion -Path "dependencies.yaml"
          if ($ffiVersion -ne $skillVersion) {
            throw "codekit-ffi version $ffiVersion must match skill.yaml version $skillVersion"
          }
          if ($dependencyVersion -ne $skillVersion) {
            throw "codekit-ffi dependency version $dependencyVersion must match skill.yaml version $skillVersion"
          }
          $manifestTag = "v$skillVersion"
          if ($version -ne $manifestTag) {
            throw "release version $version must match tagged skill.yaml version $manifestTag"
          }

          # Require every joint release to include the previously committed RG baseline.
          # 要求每个联合版本都包含此前已提交的 RG 基线。
          git merge-base --is-ancestor 9227ab2ce5efb2381b4df26a347b897d7ee171fe "refs/tags/$version^{commit}"
          if ($LASTEXITCODE -ne 0) {
            throw "release tag $version must contain RG baseline commit 9227ab2"
          }

          $luaskillRunner = Normalize-Runner -Runner $env:INPUT_LUASKILL_RUNNER -Default "ubuntu-latest"
          $buildLuaskill = if ($env:INPUT_BUILD_LUASKILL -eq "off" -or $luaskillRunner -eq "off") { "false" } else { "true" }

          # Targets stores only the FFI platforms explicitly left enabled for this release run.
          # Targets 仅保存本次发布明确启用的 FFI 平台。
          $targets = [System.Collections.Generic.List[object]]::new()
          Add-FfiTarget -Targets $targets -Platform "linux-x64" -Runner (Normalize-Runner -Runner $env:INPUT_LINUX_X64_RUNNER -Default "ubuntu-latest") -RustTarget "x86_64-unknown-linux-gnu" -LibraryPath "target/x86_64-unknown-linux-gnu/release/libvulcan_codekit_ffi.so"
          Add-FfiTarget -Targets $targets -Platform "linux-arm64" -Runner (Normalize-Runner -Runner $env:INPUT_LINUX_ARM64_RUNNER -Default "ubuntu-24.04-arm") -RustTarget "aarch64-unknown-linux-gnu" -LibraryPath "target/aarch64-unknown-linux-gnu/release/libvulcan_codekit_ffi.so"
          Add-FfiTarget -Targets $targets -Platform "macos-arm64" -Runner (Normalize-Runner -Runner $env:INPUT_MACOS_ARM64_RUNNER -Default "macos-15") -RustTarget "aarch64-apple-darwin" -LibraryPath "target/aarch64-apple-darwin/release/libvulcan_codekit_ffi.dylib"
          Add-FfiTarget -Targets $targets -Platform "macos-x64" -Runner (Normalize-Runner -Runner $env:INPUT_MACOS_X64_RUNNER -Default "macos-15-intel") -RustTarget "x86_64-apple-darwin" -LibraryPath "target/x86_64-apple-darwin/release/libvulcan_codekit_ffi.dylib"
          Add-FfiTarget -Targets $targets -Platform "windows-x64" -Runner (Normalize-Runner -Runner $env:INPUT_WINDOWS_X64_RUNNER -Default "windows-latest") -RustTarget "x86_64-pc-windows-msvc" -LibraryPath "target/x86_64-pc-windows-msvc/release/vulcan_codekit_ffi.dll"

          $matrixJson = @{ include = @($targets) } | ConvertTo-Json -Compress -Depth 5
          $hasFfiTargets = if ($targets.Count -gt 0) { "true" } else { "false" }
          $hasWork = if ($buildLuaskill -eq "true" -or $hasFfiTargets -eq "true") { "true" } else { "false" }

          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "luaskill_runner=$luaskillRunner" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "build_luaskill=$buildLuaskill" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "ffi_matrix=$matrixJson" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "has_ffi_targets=$hasFfiTargets" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "has_work=$hasWork" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

  no-work-selected:
    name: No Enabled Release Work
    needs: prepare-release
    if: needs.prepare-release.outputs.has_work != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Report skipped release
        shell: bash
        run: |
          echo "LuaSkill packaging is off and all FFI runners are off. Nothing to publish."

  validate-release:
    name: Validate Release Candidate
    needs: prepare-release
    if: needs.prepare-release.outputs.has_work == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.version }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip pyyaml
          cargo install cargo-deny --locked --version 0.20.2

      - name: Validate manifests and generated license report
        run: |
          python ./scripts/validate_skill.py
          python ./scripts/generate_cargo_deny_notices.py --check

      - name: Validate unified CodeKit FFI
        run: |
          cargo fmt --manifest-path codekit-ffi/Cargo.toml --check
          cargo clippy --manifest-path codekit-ffi/Cargo.toml --all-targets --locked -- -D warnings
          cargo test --manifest-path codekit-ffi/Cargo.toml --locked
          cargo deny --manifest-path codekit-ffi/Cargo.toml --config codekit-ffi/deny.toml --exclude-dev check licenses

  build-luaskill:
    name: Build LuaSkill Package
    needs:
      - prepare-release
      - validate-release
    if: needs.prepare-release.outputs.build_luaskill == 'true'
    runs-on: >-
      ${{
        (startsWith(needs.prepare-release.outputs.luaskill_runner, 'ubuntu') || startsWith(needs.prepare-release.outputs.luaskill_runner, 'macos') || startsWith(needs.prepare-release.outputs.luaskill_runner, 'windows'))
        && fromJSON(format('["{0}"]', needs.prepare-release.outputs.luaskill_runner))
        || fromJSON(format('["self-hosted", "{0}"]', needs.prepare-release.outputs.luaskill_runner))
      }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.version }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packaging dependencies
        run: python -m pip install --upgrade pip pyyaml

      - name: Validate strict skill layout
        run: python ./scripts/validate_skill.py

      - name: Build skill package
        run: python ./scripts/package_skill.py

      - name: Stage LuaSkill release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-luaskill
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  build-ffi:
    name: Build FFI ${{ matrix.platform }}
    needs:
      - prepare-release
      - validate-release
    if: needs.prepare-release.outputs.has_ffi_targets == 'true'
    runs-on: >-
      ${{
        (startsWith(matrix.runner, 'ubuntu') || startsWith(matrix.runner, 'macos') || startsWith(matrix.runner, 'windows'))
        && fromJSON(format('["{0}"]', matrix.runner))
        || fromJSON(format('["self-hosted", "{0}"]', matrix.runner))
      }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare-release.outputs.ffi_matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.version }}

      - name: Set up Rust (Unix)
        if: runner.os != 'Windows'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Set up Rust (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # GitHub-hosted Windows has rustup, while self-hosted runners may need a fresh install.
          # GitHub 托管 Windows 通常已有 rustup，自托管 runner 则可能需要临时安装。
          if (-not (Get-Command rustup -ErrorAction SilentlyContinue)) {
            $rustupInit = Join-Path $env:RUNNER_TEMP "rustup-init.exe"
            Invoke-WebRequest -Uri "https://win.rustup.rs/x86_64" -OutFile $rustupInit
            & $rustupInit -y --profile minimal --default-toolchain stable
            $cargoBin = Join-Path $env:USERPROFILE ".cargo\bin"
            $env:PATH = "$cargoBin;$env:PATH"
            Add-Content -Path $env:GITHUB_PATH -Value $cargoBin
          }

          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add ${{ matrix.rust_target }}
          rustc --version
          cargo --version

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build unified CodeKit FFI
        run: cargo build --manifest-path codekit-ffi/Cargo.toml --release --locked --target ${{ matrix.rust_target }} --target-dir target

      - name: Execute unified CodeKit FFI public ABI smoke
        run: python ./scripts/smoke_ffi.py --library-path ${{ matrix.library_path }} --repo-root .

      - name: Package unified CodeKit FFI
        run: python ./scripts/package_ffi.py --platform ${{ matrix.platform }} --library-path ${{ matrix.library_path }}

      - name: Stage FFI release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-ffi-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  publish-release:
    name: Publish Complete GitHub Release
    needs:
      - prepare-release
      - validate-release
      - build-luaskill
      - build-ffi
    if: >-
      always() &&
      needs.prepare-release.outputs.has_work == 'true' &&
      needs.validate-release.result == 'success' &&
      (needs.build-luaskill.result == 'success' || needs.build-luaskill.result == 'skipped') &&
      (needs.build-ffi.result == 'success' || needs.build-ffi.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Download complete release assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Create or update complete release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          tag_name: ${{ needs.prepare-release.outputs.version }}
          name: Vulcan CodeKit ${{ needs.prepare-release.outputs.version }}
          fail_on_unmatched_files: true
          body: |
            Vulcan CodeKit LuaSkill release ${{ needs.prepare-release.outputs.version }}.

            - Skill package assets follow the managed LuaSkill GitHub release naming rules.
            - This joint release includes the previously committed RG scale/diagnostic improvements and the new repository-first Repo Map workflow.
            - Unified codekit-ffi assets provide compatible ast-grep scanning plus Tokei-powered repository statistics and are installed by dependencies.yaml from this same release.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
