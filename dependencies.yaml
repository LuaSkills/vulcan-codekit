tool_dependencies:
  - name: rg
    version: "14.1.1"
    required: true
    scope: skill
    source:
      type: github_release
      github:
        repo: BurntSushi/ripgrep
    packages:
      windows-x64:
        archive_type: zip
        asset_name: ripgrep-{version}-x86_64-pc-windows-msvc.zip
        exports:
          - archive_path: ripgrep-{version}-x86_64-pc-windows-msvc/rg.exe
            target_path: bin/rg.exe
      linux-x64:
        archive_type: tar_gz
        asset_name: ripgrep-{version}-x86_64-unknown-linux-musl.tar.gz
        exports:
          - archive_path: ripgrep-{version}-x86_64-unknown-linux-musl/rg
            target_path: bin/rg
            executable: true
      linux-arm64:
        archive_type: tar_gz
        asset_name: ripgrep-{version}-aarch64-unknown-linux-gnu.tar.gz
        exports:
          - archive_path: ripgrep-{version}-aarch64-unknown-linux-gnu/rg
            target_path: bin/rg
            executable: true
      macos-arm64:
        archive_type: tar_gz
        asset_name: ripgrep-{version}-aarch64-apple-darwin.tar.gz
        exports:
          - archive_path: ripgrep-{version}-aarch64-apple-darwin/rg
            target_path: bin/rg
            executable: true
      macos-x64:
        archive_type: tar_gz
        asset_name: ripgrep-{version}-x86_64-apple-darwin.tar.gz
        exports:
          - archive_path: ripgrep-{version}-x86_64-apple-darwin/rg
            target_path: bin/rg
            executable: true

lua_dependencies: []

ffi_dependencies:
  - name: codekit-ffi
    version: "0.2.3"
    required: true
    scope: skill
    # The native libraries ship inside the skill package under native/{platform}/; the release
    # workflow stages them with scripts/stage_native.py before packaging.
    # 原生库随技能包分发，位于 native/{platform}/；发布 workflow 在打包前用 scripts/stage_native.py 暂存。
    source:
      type: bundled
    packages:
      windows-x64:
        archive_type: raw
        path: native/windows-x64/vulcan_codekit_ffi.dll
        exports:
          - archive_path: vulcan_codekit_ffi.dll
            target_path: lib/vulcan_codekit_ffi.dll
      linux-x64:
        archive_type: raw
        path: native/linux-x64/libvulcan_codekit_ffi.so
        exports:
          - archive_path: libvulcan_codekit_ffi.so
            target_path: lib/libvulcan_codekit_ffi.so
            executable: true
      linux-arm64:
        archive_type: raw
        path: native/linux-arm64/libvulcan_codekit_ffi.so
        exports:
          - archive_path: libvulcan_codekit_ffi.so
            target_path: lib/libvulcan_codekit_ffi.so
            executable: true
      macos-arm64:
        archive_type: raw
        path: native/macos-arm64/libvulcan_codekit_ffi.dylib
        exports:
          - archive_path: libvulcan_codekit_ffi.dylib
            target_path: lib/libvulcan_codekit_ffi.dylib
            executable: true
      macos-x64:
        archive_type: raw
        path: native/macos-x64/libvulcan_codekit_ffi.dylib
        exports:
          - archive_path: libvulcan_codekit_ffi.dylib
            target_path: lib/libvulcan_codekit_ffi.dylib
            executable: true
